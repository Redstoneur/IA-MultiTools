name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Tests + Pylint + Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (Pylint errors only)
        run: |
          python -m pylint src/ia_multitools --errors-only

      - name: Run tests with coverage
        run: |
          python -m pytest tests --cov=src.ia_multitools.core --cov=src.ia_multitools.services --cov-report=term-missing --cov-report=xml --cov-fail-under=40

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
