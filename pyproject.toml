[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-multitools"
version = "1.0.0"
description = "Application desktop Python multiplateforme proposant plusieurs outils linguistiques assistés par IA"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GNU General Public License v3.0 (GPL-3.0-only)"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["AI", "NLP", "linguistics", "OpenAI", "desktop", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "openai>=1.12.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "SecretStorage>=3.3.3; platform_system == 'Linux'",
    "python-dotenv>=1.0.0",
    "ttkbootstrap>=1.10.1",
    "requests>=2.31.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
ia-multitools = "ia_multitools.main:main"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pylint.messages_control]
max-line-length = 100
